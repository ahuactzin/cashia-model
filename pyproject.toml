[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cashia-model"
version = "1.1.0"
description = "Model package for Cashia"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Juan Manuel Ahuactzin", email = "juan.manuel.ahuactzin@gmail.com" }
]
dependencies = [
    "cashia-core==1.1.0",
    "pandas==2.2.3",
    "numpy==1.26.0",
    "scikit-learn==1.5.2",
    "scipy==1.16.3",
    "joblib==1.3.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
